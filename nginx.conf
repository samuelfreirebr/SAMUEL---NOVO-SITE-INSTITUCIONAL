server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # /global serve /global/index.html sem redirecionar para /global/
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # ---- Cache -------------------------------------------------------
  # Os dois index.html NÃO podem ser cacheados: eles é que apontam para
  # a versão dos assets (?v=). HTML velho em cache serve CSS velho, e o
  # layout quebra de formas confusas.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Assets levam ?v= no nome, então mudam de URL a cada alteração:
  # podem ser cacheados para sempre.
  location ~* \.(css|js|woff2|jpg|png|webp|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;
}
