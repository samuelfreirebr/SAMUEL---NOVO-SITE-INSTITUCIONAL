<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cofre | Painel Samuel Freire</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles/tokens.css?v=20260909h">
<link rel="stylesheet" href="/styles/base.css?v=20260911a">
<link rel="stylesheet" href="/admin/painel.css?v=7">
<link rel="stylesheet" href="/admin/formularios/formularios.css?v=2">
<link rel="stylesheet" href="./cofre.css?v=3">
</head>
<body class="fm">

<header class="topo">
  <h1><a href="/admin/">Painel</a> <i>Samuel Freire</i><span class="sec">Cofre</span></h1>
  <div class="fm-topo__acoes">
    <button class="btn btn--brand btn--peq" type="button" id="novo"></button>
  </div>
</header>

<p class="aviso" id="aviso" role="status"></p>

<main class="fm-raiz">
  <section class="fm-intro">
    <p class="eyebrow">Links úteis</p>
    <h2 class="fm-titulo">Cofre</h2>
  </section>

  <label class="cf-busca">
    <span class="cf-busca__ico" id="busca-ico"></span>
    <input type="search" id="busca" placeholder="Cole um link ou busque" autocomplete="off" aria-label="Colar link ou buscar no cofre" aria-describedby="dica" autofocus>
    <kbd>/</kbd>
  </label>
  <p class="cf-dica-barra" id="dica">Colou um link, está guardado: a IA dá o nome, explica para que serve e põe na categoria certa. <span class="cf-favorito" id="favorito-caixa" hidden>Para guardar de qualquer site, arraste para a barra de favoritos: <a class="mini" id="favorito">Guardar no Cofre</a></span></p>

  <div class="cf-filtros" id="filtros" role="toolbar" aria-label="Filtrar por categoria"></div>

  <div class="cf-lista" id="lista"><p class="vazio">Carregando…</p></div>
</main>

<dialog id="jan" class="fm-jan cf-jan">
  <header class="fm-jan__topo">
    <div><p class="eyebrow" id="jan-eyebrow">Novo</p><p class="fm-jan__titulo" id="jan-titulo">Guardar no cofre</p></div>
    <button class="fm-jan__fechar" type="button" id="jan-fechar" aria-label="Fechar">&times;</button>
  </header>
  <form class="fm-jan__corpo" id="form" method="dialog">
    <label class="fm-campo">
      <span>Link</span>
      <div class="cf-linha">
        <input type="text" id="f-url" inputmode="url" autocomplete="off" placeholder="https://... (vazio para guardar só uma anotação)">
        <button class="mini" type="button" id="f-ia"></button>
      </div>
      <small class="cf-dica" id="f-ia-aviso" hidden></small>
    </label>
    <label class="fm-campo">
      <span>Nome</span>
      <input type="text" id="f-nome" required maxlength="160" placeholder="Exemplo: Excalidraw">
    </label>
    <label class="fm-campo">
      <span>Para que serve</span>
      <textarea id="f-descricao" rows="5" placeholder="O que é, o que faz e quando usar. Também cabe um prompt ou um comando."></textarea>
    </label>
    <div class="cf-dupla">
      <label class="fm-campo">
        <span>Categoria</span>
        <select id="f-categoria"></select>
      </label>
      <label class="fm-campo">
        <span>Tags</span>
        <input type="text" id="f-tags" placeholder="separe por vírgula">
      </label>
    </div>
    <label class="cf-check"><input type="checkbox" id="f-fixado"> Fixar no topo</label>
  </form>
  <footer class="fm-jan__pe cf-pe">
    <button class="mini mini--perigo" type="button" id="f-apagar" hidden></button>
    <button class="btn btn--brand btn--peq" type="submit" form="form" id="f-salvar">Salvar</button>
  </footer>
</dialog>

<script type="module" src="./cofre.js?v=2"></script>
</body>
</html>
