<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cofre | Painel Samuel Freire</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles/tokens.css?v=20260909h">
<link rel="stylesheet" href="/styles/base.css?v=20260911a">
<link rel="stylesheet" href="/admin/painel.css?v=9">
<link rel="stylesheet" href="/admin/formularios/formularios.css?v=2">
<link rel="stylesheet" href="./cofre.css?v=8">
</head>
<body class="fm">

<header class="topo">
  <h1><a href="/admin/">Painel</a> <i>Samuel Freire</i><span class="sec">Cofre</span></h1>
</header>

<p class="aviso" id="aviso" role="status"></p>

<main class="fm-raiz">
  <div class="cf-cabeca">
    <h2 class="fm-titulo">Cofre</h2>
    <button class="mini" type="button" id="novo"></button>
  </div>

  <label class="cf-busca">
    <span class="cf-busca__ico" id="busca-ico"></span>
    <input type="search" id="busca" placeholder="Cole ou busque" autocomplete="off" aria-label="Colar para guardar ou buscar no cofre" aria-describedby="dica" autofocus>
    <kbd>/</kbd>
    <button class="mini mini--ativo" type="button" id="guardar-barra" hidden></button>
  </label>
  <p class="cf-dica-barra" id="dica">Cole qualquer coisa para guardar. A IA dá o nome e põe no lugar certo.</p>

  <div class="cf-filtros" id="filtros" role="group" aria-label="Filtrar por categoria"></div>

  <div class="cf-lista" id="lista"><p class="vazio">Carregando…</p></div>

  <p class="cf-favorito" id="favorito-caixa" hidden>Para guardar de qualquer site, arraste para a barra de favoritos: <a class="mini" id="favorito">Guardar no Cofre</a></p>
</main>

<dialog id="jan" class="fm-jan cf-jan" aria-labelledby="jan-titulo">
  <header class="fm-jan__topo">
    <p class="fm-jan__titulo" id="jan-titulo">Guardar no cofre</p>
    <button class="fm-jan__fechar" type="button" id="jan-fechar" aria-label="Fechar">&times;</button>
  </header>
  <form class="fm-jan__corpo" id="form" method="dialog">
    <div class="fm-campo">
      <label class="cf-rotulo" for="f-url">Link</label>
      <div class="cf-linha">
        <input type="text" id="f-url" inputmode="url" autocomplete="off" placeholder="https://... (opcional)" aria-describedby="f-ia-aviso">
        <button class="mini" type="button" id="f-ia"></button>
      </div>
      <p class="cf-dica" id="f-ia-aviso" role="status"></p>
    </div>
    <label class="fm-campo">
      <span>Texto guardado</span>
      <textarea id="f-conteudo" rows="6" placeholder="O prompt, o comando ou o trecho, exatamente como você quer copiar depois (opcional)"></textarea>
    </label>
    <label class="fm-campo">
      <span>Nome</span>
      <input type="text" id="f-nome" required maxlength="160" placeholder="Exemplo: Excalidraw">
    </label>
    <label class="fm-campo">
      <span>Para que serve</span>
      <textarea id="f-descricao" placeholder="O que é, o que faz e quando usar." rows="3"></textarea>
    </label>
    <div class="cf-dupla">
      <label class="fm-campo">
        <span>Categoria</span>
        <select id="f-categoria"></select>
      </label>
      <label class="fm-campo">
        <span>Tags</span>
        <input type="text" id="f-tags" placeholder="separe por vírgula">
      </label>
    </div>
    <label class="cf-check"><input type="checkbox" id="f-fixado"> Fixar no topo</label>
  </form>
  <footer class="fm-jan__pe cf-pe">
    <button class="mini mini--perigo" type="button" id="f-apagar" hidden></button>
    <button class="btn btn--brand btn--peq" type="submit" form="form" id="f-salvar">Salvar</button>
  </footer>
</dialog>

<script type="module" src="./cofre.js?v=6"></script>
</body>
</html>
