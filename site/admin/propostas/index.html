<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Propostas | Painel Samuel Freire</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles/tokens.css?v=20260909h">
<link rel="stylesheet" href="/styles/base.css?v=20260911a">
<link rel="stylesheet" href="/admin/painel.css?v=1">
<link rel="stylesheet" href="./editor.css">
</head>
<body class="ed">

<header class="topo">
  <h1><a href="/admin/">Painel</a> <i>Samuel Freire</i><span class="sec" id="topo-sec">Propostas</span></h1>
  <div class="ed-topo__acoes" id="topo-acoes"></div>
</header>

<p class="aviso" id="aviso" role="status"></p>

<main class="ed-raiz" id="app">
  <p class="ed-vazio" style="padding:var(--sp-xl)">Carregando…</p>
</main>

<dialog id="escolher">
  <div class="modal__topo">
    <b>Escolher imagem</b>
    <button class="mini" type="button" id="escolher-fechar">Fechar</button>
  </div>
  <div class="modal__corpo">
    <div class="solta" id="solta">
      <b>Arraste a foto aqui</b>
      <span>ou clique para escolher. JPG, PNG, WebP ou AVIF, até 6 MB.</span>
    </div>
    <input type="file" id="arquivo" accept="image/*" hidden>
    <div class="galeria-adm" id="galeria"></div>
    <p class="vazio" id="galeria-vazia" hidden>Nenhuma imagem enviada ainda.</p>
  </div>
</dialog>

<script type="module" src="./editor.js"></script>
</body>
</html>
