# ============================================================
#  Stack do Portainer.
#
#  IMPORTANTE: use *Repository*, nao *Web editor*.
#
#  Este arquivo manda construir a imagem a partir do Dockerfile
#  ("build: ."). Para isso o Portainer precisa ter os arquivos do
#  projeto em maos, e ele so os tem quando clona o repositorio.
#  Colando o texto no Web editor nao existe pasta nenhuma, e o
#  build falha mesmo com o YAML correto.
#
#  Stacks -> Add stack -> Repository
#    Repository URL   https://github.com/samuelfreirebr/SAMUEL---NOVO-SITE-INSTITUCIONAL
#    Reference        refs/heads/main
#    Compose path     docker-compose.yml
#
#  E em Environment variables, antes do deploy:
#    SENHA_PAINEL     a senha do painel
#    PORTA_HOST       80 se nao houver proxy na frente (padrao 8080)
# ============================================================

services:
  site:
    build: .
    image: samuel-site:local
    container_name: samuel-site
    restart: unless-stopped
    ports:
      # Porta do host. Sem proxy na frente, ponha PORTA_HOST=80 nas
      # variaveis da stack para o site abrir sem :8080 no endereco.
      - "${PORTA_HOST:-8080}:3000"
    environment:
      # Obrigatoria. Sem ela a stack nao sobe, de proposito:
      # uma tranca que depende de alguem lembrar de ligar nao tranca.
      SENHA_PAINEL: "${SENHA_PAINEL:?defina SENHA_PAINEL nas variaveis da stack}"
      USUARIO_PAINEL: "${USUARIO_PAINEL:-samuel}"
      # Desvio automatico BR/global. So funciona atras da Cloudflare
      # em modo proxy, que e quem envia o cabecalho de pais.
      ROTEAR_POR_PAIS: "${ROTEAR_POR_PAIS:-1}"
    volumes:
      # Textos, imagens enviadas e propostas. E este volume que voce
      # copia para fazer backup — perde-lo e perder as edicoes.
      - dados:/dados

volumes:
  dados:
